version: 2
updates:
  - package-ecosystem: npm
    directory: /
    assignees:
      - ackervekenbm
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - '*'
    ignore:
      # TypeScript 7 is the native-compiler line; typescript-eslint still only
      # supports typescript <6.1.0 (peer range), so the weekly group is
      # uninstallable when it pulls TS 7. We still want 6.0.x patches, so block
      # only the major. Revisit when typescript-eslint supports TS 7 (see #62).
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: github-actions
    directory: /
    assignees:
      - ackervekenbm
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  # The Dockerfile's base image is pinned by digest; this keeps it patched.
  # Majors (Node 24) are a deliberate move, not a weekly bump.
  - package-ecosystem: docker
    directory: /
    assignees:
      - ackervekenbm
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: 'node'
        update-types:
          - 'version-update:semver-major'
